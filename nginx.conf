# Nginx configuration for reverse proxy (optional but recommended)
# Place this in /etc/nginx/sites-available/brodo-cms on your Azure VM

upstream brodo_app {
    server localhost:3000;
}

server {
    listen 80;
    server_name 40.81.26.137;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client body size limit
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/brodo-cms-access.log;
    error_log /var/log/nginx/brodo-cms-error.log;

    location / {
        proxy_pass http://brodo_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files caching
    location /_next/static {
        proxy_pass http://brodo_app;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # Assets caching
    location /assets {
        proxy_pass http://brodo_app;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=3600";
    }
}
